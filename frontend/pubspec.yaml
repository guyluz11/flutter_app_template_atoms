name: flutter_app_template_atoms
description: "A new Flutter project."
publish_to: 'none'
repository: https://github.com/guyluz11/flutter_app_template_atoms

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  animated_toggle_switch: ^0.8.5
  # Automatically resizes text to fit perfectly within its bounds.
  auto_size_text: ^3.0.0
  awesome_notifications: ^0.10.1
  awesome_notifications_core: ^0.10.1
  confetti: ^0.8.0
  # Adds the Cupertino Icons font.
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.5.0
  flutter:
    sdk: flutter

  flutter_soloud: ^3.2.7
  # Toast Library for Flutter, Easily create toast messages in single line of code.
  fluttertoast: ^8.2.11
  # Font Awesome Icon pack available as Flutter Icons.
  font_awesome_flutter: ^10.8.0
  google_fonts: ^6.2.1
  # Progress indicator
  liquid_progress_indicator_v2: ^0.5.0
  # Logger which prints beautiful logs.
  logger: ^2.6.0
  markdown_widget: ^2.3.2+8
  shared_preferences: ^2.5.3
  vibration: ^3.1.1
  wakelock_plus: ^1.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Collection of lint rules for Dart and Flutter projects.
  lint: ^2.8.0
flutter:

  uses-material-design: true
  assets:
    - assets/
    - assets/sound_effects/




# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo.png"

  android: "ic_launcher"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#88a6b3"
  adaptive_icon_foreground: "assets/logo.png"
  #  adaptive_icon_monochrome: "assets/logo_with_bg.png"

  ios: true
  image_path_ios: "assets/logo.png"
  # image_path_ios: "assets/icon/logo.png"
  remove_alpha_ios: true
  # image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  # image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"
  # desaturate_tinted_to_grayscale_ios: true

  web:
    generate: true
    image_path: "assets/logo_with_bg.png"
    background_color: "#88a6b3"
    theme_color: "#88a6b3"

  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/logo_with_bg.png"
